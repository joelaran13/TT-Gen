<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Timetable Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .print-shadow { box-shadow: none !important; border: 1px solid #cbd5e1 !important; }
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col font-sans antialiased">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <button onclick="toggleMobileSidebar()" class="lg:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100 transition focus:outline-none focus:ring-2 focus:ring-indigo-500" aria-label="Toggle Sidebar">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md flex items-center justify-center">
                    <i class="fa-solid fa-calendar-days text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight">TimeCraft</h1>
                    <p class="text-xs text-slate-500 font-medium hidden sm:block">Interactive Timetable & Schedule Generator</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 sm:space-x-3">
                <button onclick="openConfigModal()" class="inline-flex items-center px-3 py-2 border border-slate-300 text-xs sm:text-sm font-medium rounded-lg text-slate-700 bg-white hover:bg-slate-50 shadow-sm transition">
                    <i class="fa-solid fa-gear sm:mr-2 text-slate-500"></i> <span class="hidden sm:inline">Configure Grid</span><span class="sm:hidden">Config</span>
                </button>
                <button onclick="exportTable()" class="inline-flex items-center px-3.5 sm:px-4 py-2 bg-indigo-600 text-white text-xs sm:text-sm font-medium rounded-lg hover:bg-indigo-700 shadow-sm transition">
                    <i class="fa-solid fa-print sm:mr-2"></i> <span class="hidden sm:inline">Print / Export</span><span class="sm:hidden">Export</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-2 sm:px-6 lg:px-8 py-4 sm:py-6 flex flex-col lg:flex-row gap-4 sm:gap-6 overflow-hidden relative">
        
        <!-- Mobile Sidebar Overlay -->
        <div id="sidebar-overlay" onclick="toggleMobileSidebar()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 lg:hidden hidden transition-opacity"></div>

        <!-- Sidebar (Drawer on mobile, sticky sidebar on desktop) -->
        <aside id="sidebar-drawer" class="fixed inset-y-0 left-0 z-50 w-80 bg-white p-4 sm:p-5 shadow-2xl lg:shadow-none lg:static lg:w-80 flex-shrink-0 flex flex-col gap-5 no-print overflow-y-auto max-h-full transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out border-r lg:border border-slate-200 lg:rounded-2xl">
            <div class="flex items-center justify-between lg:hidden pb-2 border-b border-slate-100">
                <h2 class="font-bold text-slate-900 flex items-center"><i class="fa-solid fa-bars-staggered text-indigo-600 mr-2"></i> Menu & Subjects</h2>
                <button onclick="toggleMobileSidebar()" class="p-2 text-slate-400 hover:text-slate-600 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Subjects Card -->
            <div class="bg-white lg:bg-transparent rounded-2xl lg:border-0 border border-slate-100 shadow-sm lg:shadow-none p-1 sm:p-0">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-sm sm:text-base font-semibold text-slate-900 flex items-center">
                        <i class="fa-solid fa-book-open text-indigo-600 mr-2"></i> Subjects & Courses
                    </h2>
                    <span id="subject-count" class="text-xs font-medium px-2 py-0.5 bg-indigo-50 text-indigo-600 rounded-full">0</span>
                </div>
                <form id="add-subject-form" onsubmit="handleAddSubject(event)" class="space-y-3">
                    <div>
                        <input type="text" id="sub-name" placeholder="Subject Name (e.g. Mathematics)" required
                            class="w-full text-sm px-3 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="sub-code" placeholder="Code (e.g. MATH101)"
                            class="text-sm px-3 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                        <input type="text" id="sub-room" placeholder="Room (e.g. 302B)"
                            class="text-sm px-3 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div class="flex items-center justify-between pt-1">
                        <div class="flex items-center space-x-2">
                            <label for="sub-color" class="text-xs font-medium text-slate-600">Color:</label>
                            <input type="color" id="sub-color" value="#4f46e5" class="w-9 h-9 rounded-lg border border-slate-300 cursor-pointer p-0.5 bg-white">
                        </div>
                        <button type="submit" class="px-4 py-2.5 bg-slate-900 text-white text-sm font-medium rounded-xl hover:bg-slate-800 transition shadow-sm">
                            <i class="fa-solid fa-plus mr-1"></i> Add Subject
                        </button>
                    </div>
                </form>

                <div class="mt-4 border-t border-slate-100 pt-3">
                    <p class="text-[11px] sm:text-xs text-slate-500 mb-2 font-medium">Tap subject to select, then tap grid cell to assign.</p>
                    <div id="subjects-list" class="space-y-2 max-h-48 sm:max-h-56 overflow-y-auto pr-1">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

            <!-- Quick Actions Card -->
            <div class="bg-white rounded-2xl border border-slate-200/60 shadow-sm p-4">
                <h2 class="text-sm sm:text-base font-semibold text-slate-900 mb-3 flex items-center">
                    <i class="fa-solid fa-wand-magic-sparkles text-indigo-600 mr-2"></i> Quick Actions
                </h2>
                <div class="space-y-2">
                    <button onclick="autoFillSample()" class="w-full text-left px-3.5 py-2.5 text-xs sm:text-sm font-medium text-slate-700 bg-slate-50 hover:bg-slate-100 rounded-xl transition flex items-center justify-between border border-slate-200/80">
                        <span class="flex items-center"><i class="fa-solid fa-bolt text-amber-500 mr-2.5"></i> Load Sample Data</span>
                        <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
                    </button>
                    <button onclick="clearTimetable()" class="w-full text-left px-3.5 py-2.5 text-xs sm:text-sm font-medium text-rose-700 bg-rose-50 hover:bg-rose-100 rounded-xl transition flex items-center justify-between border border-rose-100">
                        <span class="flex items-center"><i class="fa-solid fa-trash-can text-rose-500 mr-2.5"></i> Clear Timetable</span>
                        <i class="fa-solid fa-chevron-right text-xs text-rose-300"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Timetable Section -->
        <section class="flex-1 bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col overflow-hidden">
            <!-- Table Toolbar inside grid view -->
            <div class="p-3 sm:p-4 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3 no-print bg-slate-50/50">
                <div class="flex items-center space-x-2">
                    <input type="text" id="timetable-title" value="My Weekly Timetable" 
                        class="text-base sm:text-lg font-bold text-slate-900 bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-600 focus:outline-none px-1 py-0.5 transition w-full sm:w-auto">
                </div>
                <div class="flex items-center justify-between sm:justify-end">
                    <div id="active-selection-indicator" class="text-xs font-medium px-3 py-1.5 bg-slate-100 text-slate-600 rounded-xl flex items-center shadow-xs w-full sm:w-auto overflow-hidden text-ellipsis whitespace-nowrap">
                        <span class="w-2 h-2 rounded-full bg-slate-400 mr-2 flex-shrink-0"></span> <span class="truncate">No subject selected</span>
                    </div>
                </div>
            </div>

            <!-- Mobile Horizontal Scroll Hint Bar -->
            <div class="sm:hidden bg-indigo-50/70 border-b border-indigo-100 px-3 py-1.5 flex items-center justify-center text-[11px] text-indigo-700 font-medium no-print">
                <i class="fa-solid fa-arrows-left-right mr-1.5"></i> Swipe horizontally to view all days
            </div>

            <!-- Responsive Table Container -->
            <div class="flex-1 overflow-auto p-2 sm:p-4 touch-pan-x touch-pan-y">
                <div id="timetable-container" class="min-w-[650px] sm:min-w-[750px]">
                    <!-- Dynamically generated table -->
                </div>
            </div>
        </section>
    </main>

    <div id="config-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <!-- ... existing modal content ... -->
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-xl hover:bg-indigo-700">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <div id="message-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 border border-slate-200 text-center">
            <div id="modal-icon" class="w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto mb-3 text-xl">
                <i class="fa-solid fa-info"></i>
            </div>
            <h3 id="modal-title" class="text-base font-bold text-slate-900 mb-1">Notice</h3>
            <p id="modal-text" class="text-sm text-slate-600 mb-5">Message goes here.</p>
            <button onclick="closeMessageModal()" class="w-full py-2.5 bg-indigo-600 text-white font-medium rounded-xl text-sm hover:bg-indigo-700 transition">OK</button>
        </div>
    </div>

    <script>
        // State management
        let state = {
            days: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            timeSlots: ["08:00 - 09:00", "09:00 - 10:00", "10:15 - 11:15", "11:15 - 12:15", "13:30 - 14:30", "14:30 - 15:30"],
            subjects: [
                { id: 'sub-1', name: 'Mathematics', code: 'MATH101', room: 'Room 201', color: '#4f46e5' },
                { id: 'sub-2', name: 'Physics', code: 'PHYS102', room: 'Lab 3', color: '#0ea5e9' },
                { id: 'sub-3', name: 'Computer Science', code: 'CS103', room: 'Lab 1', color: '#10b981' },
                { id: 'sub-4', name: 'English Literature', code: 'ENG104', room: 'Room 105', color: '#f59e0b' },
                { id: 'sub-5', name: 'History', code: 'HIST105', room: 'Room 204', color: '#ec4899' }
            ],
            schedule: {}, // key: "dayIndex-slotIndex", value: subjectId
            selectedSubjectId: null
        };

        function toggleMobileSidebar() {
            const drawer = document.getElementById('sidebar-drawer');
            const overlay = document.getElementById('sidebar-overlay');
            const isOpen = !drawer.classList.contains('-translate-x-full');
            
            if (isOpen) {
                drawer.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            } else {
                drawer.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            }
        }

        // Load saved state from localStorage if available
        function loadState() {
            const saved = localStorage.getItem('timecraft_state');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                } catch(e) {
                    console.error("Failed to load saved state", e);
                }
            }
        }

        function saveState() {
            localStorage.setItem('timecraft_state', JSON.stringify({
                days: state.days,
                timeSlots: state.timeSlots,
                subjects: state.subjects,
                schedule: state.schedule
            }));
        }

        // Custom notification dialog instead of alert()
        function showMessage(title, text, type = 'info') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-text').innerText = text;
            const iconEl = document.getElementById('modal-icon');
            if(type === 'success') {
                iconEl.className = 'w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto mb-3 text-xl';
                iconEl.innerHTML = '<i class="fa-solid fa-check"></i>';
            } else if(type === 'error') {
                iconEl.className = 'w-12 h-12 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center mx-auto mb-3 text-xl';
                iconEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            } else {
                iconEl.className = 'w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto mb-3 text-xl';
                iconEl.innerHTML = '<i class="fa-solid fa-info"></i>';
            }
            document.getElementById('message-modal').classList.remove('hidden');
        }

        function closeMessageModal() {
            document.getElementById('message-modal').classList.add('hidden');
        }

        // Render functions
        function renderAll() {
            renderSubjectsList();
            renderTimetableGrid();
            updateSelectionIndicator();
        }

        function renderSubjectsList() {
            const container = document.getElementById('subjects-list');
            document.getElementById('subject-count').innerText = state.subjects.length;
            
            if (state.subjects.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">No subjects added yet.</p>';
                return;
            }

            container.innerHTML = state.subjects.map(sub => {
                const isSelected = state.selectedSubjectId === sub.id;
                return `
                    <div onclick="selectSubject('${sub.id}')" 
                        class="p-3 rounded-xl border transition cursor-pointer flex items-center justify-between group ${isSelected ? 'border-indigo-600 bg-indigo-50/50 shadow-sm ring-1 ring-indigo-600' : 'border-slate-200 hover:border-slate-300 bg-white'}">
                        <div class="flex items-center space-x-3 overflow-hidden">
                            <div class="w-3.5 h-3.5 rounded-full flex-shrink-0" style="background-color: ${sub.color}"></div>
                            <div class="truncate">
                                <p class="text-sm font-semibold text-slate-900 truncate">${sub.name}</p>
                                <p class="text-xs text-slate-500 truncate">${sub.code || ''} ${sub.room ? '• ' + sub.room : ''}</p>
                            </div>
                        </div>
                        <button onclick="event.stopPropagation(); deleteSubject('${sub.id}')" 
                            class="text-slate-400 hover:text-rose-600 p-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `;
            }).join('');
        }

        function renderTimetableGrid() {
            const container = document.getElementById('timetable-container');
            
            let html = `
                <table class="w-full border-collapse print-shadow">
                    <thead>
                        <tr class="bg-slate-100/70 border-b border-slate-200">
                            <th class="py-3 px-4 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider w-32 border-r border-slate-200">Time / Day</th>
            `;
            
            state.days.forEach(day => {
                html += `<th class="py-3 px-4 text-center text-xs font-semibold text-slate-600 uppercase tracking-wider border-r border-slate-200 last:border-r-0">${day}</th>`;
            });
            
            html += `</tr></thead><tbody>`;

            state.timeSlots.forEach((slot, slotIndex) => {
                html += `<tr class="border-b border-slate-200 hover:bg-slate-50/50 transition">`;
                html += `<td class="py-3 px-4 text-xs font-medium text-slate-600 bg-slate-50/50 border-r border-slate-200 whitespace-nowrap">${slot}</td>`;

                state.days.forEach((day, dayIndex) => {
                    const key = `${dayIndex}-${slotIndex}`;
                    const assignedSubId = state.schedule[key];
                    const sub = state.subjects.find(s => s.id === assignedSubId);

                    if (sub) {
                        html += `
                            <td onclick="handleCellClick(${dayIndex}, ${slotIndex})" 
                                class="p-2 border-r border-slate-200 last:border-r-0 cursor-pointer relative group h-24 align-top">
                                <div class="w-full h-full rounded-xl p-2.5 flex flex-col justify-between shadow-sm transition transform hover:scale-[1.02]" 
                                    style="background-color: ${sub.color}15; border-left: 4px solid ${sub.color};">
                                    <div>
                                        <p class="text-xs font-bold text-slate-900 leading-snug">${sub.name}</p>
                                        <p class="text-[11px] text-slate-600 mt-0.5">${sub.code || ''}</p>
                                    </div>
                                    <div class="flex items-center justify-between text-[10px] text-slate-500 font-medium">
                                        <span>${sub.room || ''}</span>
                                        <button onclick="event.stopPropagation(); clearCell(${dayIndex}, ${slotIndex})" 
                                            class="text-slate-400 hover:text-rose-600 opacity-0 group-hover:opacity-100 transition p-1">
                                            <i class="fa-solid fa-xmark"></i>
                                        </button>
                                    </div>
                                </div>
                            </td>
                        `;
                    } else {
                        html += `
                            <td onclick="handleCellClick(${dayIndex}, ${slotIndex})" 
                                class="p-2 border-r border-slate-200 last:border-r-0 cursor-pointer group h-24 align-top">
                                <div class="w-full h-full rounded-xl border border-dashed border-slate-200 group-hover:border-indigo-400 group-hover:bg-indigo-50/30 transition flex items-center justify-center">
                                    <span class="text-slate-300 group-hover:text-indigo-400 text-xs font-medium opacity-0 group-hover:opacity-100 transition">
                                        <i class="fa-solid fa-plus mr-1"></i> Add
                                    </span>
                                </div>
                            </td>
                        `;
                    }
                });

                html += `</tr>`;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function selectSubject(id) {
            state.selectedSubjectId = state.selectedSubjectId === id ? null : id;
            updateSelectionIndicator();
            renderSubjectsList();
            // On mobile, automatically close drawer after selecting a subject to immediately let users tap cells
            if (window.innerWidth < 1024 && state.selectedSubjectId) {
                toggleMobileSidebar();
            }
        }

        function updateSelectionIndicator() {
            const indicator = document.getElementById('active-selection-indicator');
            if (state.selectedSubjectId) {
                const sub = state.subjects.find(s => s.id === state.selectedSubjectId);
                indicator.innerHTML = `<span class=\"w-2 h-2 rounded-full mr-2 flex-shrink-0\" style=\"background-color: ${sub.color}\"></span> <span class=\"truncate\">Selected: <strong class=\"ml-0.5\">${sub.name}</strong> (Tap cell)</span>`;
                indicator.className = 'text-xs font-medium px-3 py-1.5 bg-indigo-50 text-indigo-700 rounded-xl flex items-center border border-indigo-100 shadow-xs';
            } else {
                indicator.innerHTML = `<span class=\"w-2 h-2 rounded-full bg-slate-400 mr-2 flex-shrink-0\"></span> <span class=\"truncate\">No subject selected (Tap a subject)</span>`;
                indicator.className = 'text-xs font-medium px-3 py-1.5 bg-slate-100 text-slate-600 rounded-xl flex items-center shadow-xs';
            }
        }

        function handleAddSubject(e) {
            e.preventDefault();
            const name = document.getElementById('sub-name').value.trim();
            const code = document.getElementById('sub-code').value.trim();
            const room = document.getElementById('sub-room').value.trim();
            const color = document.getElementById('sub-color').value;

            if (!name) return;

            const newSub = {
                id: 'sub-' + Date.now(),
                name,
                code,
                room,
                color
            };

            state.subjects.push(newSub);
            state.selectedSubjectId = newSub.id;
            document.getElementById('add-subject-form').reset();
            document.getElementById('sub-color').value = '#4f46e5';

            saveState();
            renderAll();
        }

        function deleteSubject(id) {
            state.subjects = state.subjects.filter(s => s.id !== id);
            if (state.selectedSubjectId === id) state.selectedSubjectId = null;
            
            // Remove from schedule
            Object.keys(state.schedule).forEach(key => {
                if (state.schedule[key] === id) {
                    delete state.schedule[key];
                }
            });

            saveState();
            renderAll();
        }

        function handleCellClick(dayIndex, slotIndex) {
            const key = `${dayIndex}-${slotIndex}`;
            if (state.selectedSubjectId) {
                state.schedule[key] = state.selectedSubjectId;
                saveState();
                renderTimetableGrid();
            } else {
                if (state.schedule[key]) {
                    delete state.schedule[key];
                    saveState();
                    renderTimetableGrid();
                } else {
                    showMessage("Tip", "Please select a subject from the left sidebar first before clicking a cell, or click an assigned cell to clear it.");
                }
            }
        }

        function clearCell(dayIndex, slotIndex) {
            const key = `${dayIndex}-${slotIndex}`;
            delete state.schedule[key];
            saveState();
            renderTimetableGrid();
        }

        function clearTimetable() {
            state.schedule = {};
            saveState();
            renderTimetableGrid();
            showMessage("Cleared", "Timetable has been cleared successfully.", "success");
        }

        function autoFillSample() {
            state.schedule = {
                "0-0": state.subjects[0]?.id,
                "0-1": state.subjects[1]?.id,
                "0-2": state.subjects[2]?.id,
                "1-0": state.subjects[3]?.id,
                "1-1": state.subjects[4]?.id,
                "2-0": state.subjects[0]?.id,
                "2-2": state.subjects[1]?.id,
                "3-1": state.subjects[2]?.id,
                "3-3": state.subjects[3]?.id,
                "4-0": state.subjects[4]?.id,
                "4-2": state.subjects[2]?.id
            };
            saveState();
            renderTimetableGrid();
            showMessage("Success", "Sample data loaded successfully!", "success");
        }

        // Modal configuration handlers
        function openConfigModal() {
            document.getElementById('config-days').value = state.days.join(', ');
            document.getElementById('config-slots').value = state.timeSlots.join(', ');
            document.getElementById('config-modal').classList.remove('hidden');
        }

        function closeConfigModal() {
            document.getElementById('config-modal').classList.add('hidden');
        }

        function handleSaveConfig(e) {
            e.preventDefault();
            const daysInput = document.getElementById('config-days').value;
            const slotsInput = document.getElementById('config-slots').value;

            const newDays = daysInput.split(',').map(d => d.trim()).filter(d => d.length > 0);
            const newSlots = slotsInput.split(',').map(s => s.trim()).filter(s => s.length > 0);

            if (newDays.length === 0 || newSlots.length === 0) {
                showMessage("Error", "Please provide at least one day and one time slot.", "error");
                return;
            }

            state.days = newDays;
            state.timeSlots = newSlots;
            
            // Clean up obsolete schedule keys
            const validSchedule = {};
            Object.keys(state.schedule).forEach(key => {
                const [dIdx, sIdx] = key.split('-').map(Number);
                if (dIdx < newDays.length && sIdx < newSlots.length) {
                    validSchedule[key] = state.schedule[key];
                }
            });
            state.schedule = validSchedule;

            saveState();
            closeConfigModal();
            renderAll();
            showMessage("Success", "Timetable grid configuration updated!", "success");
        }

        function exportTable() {
            window.print();
        }

        // Initialize on load
        window.onload = function() {
            loadState();
            renderAll();
        }
    </script>
</body>
</html>
