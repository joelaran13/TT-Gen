<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Legends Tournament Leaderboard</title>
    <!-- Google Fonts: Rajdhani & Orbitron -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: linear-gradient(rgba(10, 10, 14, 0.90), rgba(10, 10, 14, 0.95)), 
                        url('https://images7.alphacoders.com/132/thumb-1920-1325463.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff; 
            font-family: 'Rajdhani', sans-serif; 
            text-align: center; 
            min-height: 100vh;
            padding-bottom: 60px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Background Canvas for Embers */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            opacity: 0.65;
        }

        /* Initial HUD Loading Screen Overlay */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-ring {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(255, 71, 71, 0.15);
            border-top: 4px solid #ff4747;
            border-right: 4px solid #ff4747;
            border-radius: 50%;
            animation: spin 1s linear infinite, glowPulse 1.5s ease-in-out infinite alternate;
            margin-bottom: 20px;
        }

        .loader-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 3px;
            color: #ff4747;
            animation: blink 1.2s ease-in-out infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes glowPulse { 0% { box-shadow: 0 0 10px rgba(255,71,71,0.2); } 100% { box-shadow: 0 0 25px rgba(255,71,71,0.8); } }

        .ticker-bar {
            position: relative;
            z-index: 10;
            background: rgba(198, 48, 49, 0.9);
            color: #fff;
            padding: 8px 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 2px 10px rgba(255, 62, 62, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .sync-badge {
            background: rgba(0,0,0,0.4);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: #ffbc00;
            border: 1px solid rgba(255, 188, 0, 0.4);
        }

        .container {
            position: relative;
            z-index: 5;
            max-width: 1000px;
            margin: 30px auto 0;
            padding: 0 20px;
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(231, 76, 60, 0.6);
            margin-bottom: 5px;
        }

        .header-subtitle {
            color: #ff4747;
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 30px;
            font-weight: 700;
        }

        /* Champion Spotlight Card */
        .champion-card {
            position: relative;
            background: linear-gradient(135deg, rgba(255, 71, 71, 0.25) 0%, rgba(20, 20, 26, 0.95) 100%);
            border: 2px solid #ff4747;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 0 30px rgba(255, 71, 71, 0.35);
            clip-path: polygon(0 0, 100% 0, 97% 100%, 0% 100%);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .champion-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(255, 71, 71, 0.5);
        }

        /* Sweeping Shimmer Effect across Champion Card */
        .champion-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transform: skewX(-25deg);
            animation: sweep 4s infinite;
        }

        @keyframes sweep { 0% { left: -150%; } 30%, 100% { left: 150%; } }

        .champion-info { text-align: left; z-index: 2; }
        .champion-badge { 
            font-family: 'Orbitron', sans-serif;
            background: #ff4747;
            color: #fff;
            padding: 4px 12px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            border-radius: 3px;
            display: inline-block;
            margin-bottom: 8px;
        }
        .champion-name { font-size: 2.2rem; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
        .champion-score { font-size: 2.5rem; font-family: 'Orbitron', sans-serif; color: #ffbc00; z-index: 2; }

        /* Tactical HUD Search Bar & Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
            background: rgba(18, 18, 24, 0.75);
            border: 1px solid rgba(255, 71, 71, 0.3);
            border-left: 4px solid #ff4747;
            padding: 10px 18px;
            border-radius: 6px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            position: relative;
            overflow: hidden;
        }

        .controls::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 16px 16px 0;
            border-color: transparent #ff4747 transparent transparent;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            color: #ff4747;
            font-size: 1rem;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: rgba(10, 10, 15, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            border-radius: 4px;
            outline: none;
            transition: all 0.3s ease;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .search-input::placeholder {
            color: #7a7a8c;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: none;
        }

        .search-input:focus {
            background: rgba(15, 15, 22, 0.95);
            border-color: #ff4747;
            box-shadow: 0 0 15px rgba(255, 71, 71, 0.35);
        }

        .search-input:focus ~ .search-icon {
            color: #ffbc00;
        }

        .team-count-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            color: #aaa;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 16px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap;
        }

        .team-count-badge span {
            color: #ff4747;
            font-weight: 900;
        }

        /* Leaderboard Table */
        .table-container {
            background: rgba(18, 18, 24, 0.9);
            border: 1px solid #333;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; }
        th { 
            background: #191921; 
            color: #ff4747; 
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 1.5px;
            padding: 16px;
            text-transform: uppercase;
            border-bottom: 2px solid #ff4747;
        }
        
        td { padding: 16px; font-size: 1.2rem; font-weight: 600; }
        tr.main-row { 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            transition: background 0.25s ease, transform 0.2s ease; 
            cursor: pointer; 
        }
        tr.main-row:hover { background: rgba(255, 71, 71, 0.16); }

        /* Row updating score flash animation */
        @keyframes rowPulse {
            0% { background: rgba(46, 204, 113, 0.3); }
            100% { background: transparent; }
        }

        .row-updated {
            animation: rowPulse 1.2s ease-out;
        }

        /* Rank Badges */
        .rank-cell { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; }
        .rank-1 { color: #ffd700; text-shadow: 0 0 12px rgba(255, 215, 0, 0.6); }
        .rank-2 { color: #c0c0c0; text-shadow: 0 0 10px rgba(192, 192, 192, 0.5); }
        .rank-3 { color: #cd7f32; text-shadow: 0 0 10px rgba(205, 127, 50, 0.5); }

        /* Status Animations */
        .status-wrapper { display: flex; align-items: center; justify-content: center; gap: 8px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; }

        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        .status-in-match .status-dot { background-color: #2ecc71; animation: pulse-green 1.5s infinite; }
        .status-eliminated .status-dot { background-color: #e74c3c; }
        .status-waiting .status-dot { background-color: #95a5a6; }

        /* Expandable Player Details Row */
        .details-row { display: none; background: rgba(10, 10, 15, 0.95); }
        .details-row.open { display: table-row; }
        
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            padding: 15px 25px;
            text-align: left;
        }

        .player-card {
            background: rgba(30, 30, 40, 0.8);
            border-left: 3px solid #ff4747;
            padding: 10px 15px;
            border-radius: 4px;
        }

        .player-title {
            font-size: 0.75rem;
            color: #888;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
        }

        .player-stats {
            font-size: 1.1rem;
            color: #fff;
            font-weight: 700;
        }

        .toggle-icon {
            font-size: 0.8rem;
            color: #ff4747;
            margin-left: 8px;
            transition: transform 0.3s ease;
            display: inline-block;
        }

        .toggle-icon.rotated { transform: rotate(90deg); }
    </style>
</head>
<body>

    <!-- Dynamic Particle Overlay Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- Initial Loading Screen Overlay -->
    <div id="loading-overlay">
        <div class="loader-ring"></div>
        <div class="loader-text">SYNCHRONIZING APEX NETWORK...</div>
    </div>

    <div class="ticker-bar">
        <span>⚡ LIVE BROADCAST • APEX LEGENDS UNIVERSITY CHAMPIONSHIP ⚡</span>
        <span class="sync-badge" id="sync-timer">SYNC • 3s</span>
    </div>

    <div class="container">
        <h1 class="header-title">APEX LEGENDS</h1>
        <div class="header-subtitle">Tournament Leaderboard</div>

        <div class="champion-card" id="champion-card">
            <div class="champion-info">
                <span class="champion-badge">🏆 CURRENT LEADER</span>
                <div class="champion-name" id="champ-name">Loading...</div>
            </div>
            <div class="champion-score" id="champ-score">-- PTS</div>
        </div>

        <div class="controls">
            <div class="search-wrapper">
                <input type="text" id="search-bar" class="search-input" placeholder="Search squad or player name..." onkeyup="filterTeams()">
                <span class="search-icon">🔍</span>
            </div>
            <div class="team-count-badge">SQUADS: <span id="count-val">--</span></div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Team Name</th>
                        <th>Kills</th>
                        <th>Placement</th>
                        <th>Total Score</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- Dynamic Data Rows -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Direct clean CSV export URL from Google Sheets
        const sheetId = '1RB6RdDieEWf5MBorERKsL9nWbt6qc01rY_5aCyNZjPA';
        const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv`; 

        let globalData = [];
        let isInitialLoad = true;
        let countdown = 3;
        let openTeams = new Set(); // Tracks expanded teams across live refresh cycles

        // Background Particle Embers Animation
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 20;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedY = Math.random() * 1.2 + 0.4;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.8 + 0.2;
                this.color = Math.random() > 0.4 ? '#ff4747' : '#ffbc00';
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                this.opacity -= 0.003;
                if (this.y < -10 || this.opacity <= 0) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        for (let i = 0; i < 45; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // Sync Timer Countdown
        setInterval(() => {
            countdown--;
            if (countdown <= 0) countdown = 3;
            document.getElementById('sync-timer').textContent = `SYNC • ${countdown}s`;
        }, 1000);

        async function fetchLeaderboard() {
            try {
                const cacheBustUrl = csvUrl + (csvUrl.includes('?') ? '&' : '?') + '_t=' + Date.now();
                const response = await fetch(cacheBustUrl, { 
                    cache: 'no-store',
                    headers: { 'Pragma': 'no-cache', 'Cache-Control': 'no-cache' }
                });
                if (!response.ok) return; 
                
                const csvText = await response.text();
                const rows = csvText.split('\n'); 
                globalData = [];

                for (let i = 1; i < rows.length; i++) { 
                    const line = rows[i].trim();
                    if (!line) continue; 
                    
                    if (line.startsWith('/*') || line.startsWith('var ') || line.startsWith('function') || line.startsWith('<')) {
                        continue;
                    }
                    
                    const cols = line.split(',').map(col => col.replace(/^"(.*)"$/, '$1').trim());
                    
                    if (cols[0].includes('function') || cols[0].includes('Object.') || cols[0] === 'Team Name') {
                        continue;
                    }

                    const kills = parseInt(cols[1]) || 0;
                    const placement = parseInt(cols[2]) || 0;
                    const totalCalculated = kills + placement;
                    const totalCol = parseInt(cols[3]);
                    const total = !isNaN(totalCol) && totalCol > 0 ? totalCol : totalCalculated;

                    globalData.push({
                        name: cols[0] || 'Unknown',
                        kills: kills,
                        placement: placement,
                        total: total,
                        status: cols[4] || 'Waiting',
                        p1: cols[5] || 'N/A',
                        p2: cols[6] || 'N/A',
                        p3: cols[7] || 'N/A'
                    });
                }

                globalData.sort((a, b) => b.total - a.total);

                if (globalData.length > 0) {
                    document.getElementById('champ-name').textContent = globalData[0].name;
                    document.getElementById('champ-score').textContent = globalData[0].total + ' PTS';
                }

                renderTable(globalData);

                // Hide loader overlay smoothly after initial data load
                if (isInitialLoad) {
                    isInitialLoad = false;
                    setTimeout(() => {
                        const loader = document.getElementById('loading-overlay');
                        if (loader) loader.classList.add('hidden');
                    }, 400);
                }
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = ''; 

            // Update live squad count badge
            const countVal = document.getElementById('count-val');
            if (countVal) countVal.textContent = data.length;

            data.forEach((team, index) => {
                let rankDisplay = `#${index + 1}`;
                let rankClass = '';
                if (index === 0) { rankDisplay = '🥇 #1'; rankClass = 'rank-1'; }
                else if (index === 1) { rankDisplay = '🥈 #2'; rankClass = 'rank-2'; }
                else if (index === 2) { rankDisplay = '🥉 #3'; rankClass = 'rank-3'; }

                const statusClass = team.status.toLowerCase().replace(/\s+/g, '-');
                const detailId = `details-${index}`;
                const arrowId = `arrow-${index}`;
                const isOpen = openTeams.has(team.name);

                const mainTr = document.createElement('tr');
                mainTr.className = 'main-row';
                mainTr.onclick = () => toggleDetails(team.name, detailId, arrowId);
                
                mainTr.innerHTML = `
                    <td class="rank-cell ${rankClass}">${rankDisplay}</td>
                    <td style="text-align: left; padding-left: 25px;">
                        ${team.name} <span id="${arrowId}" class="toggle-icon ${isOpen ? 'rotated' : ''}">▶</span>
                    </td>
                    <td>${team.kills}</td>
                    <td>${team.placement}</td>
                    <td style="color: #ffbc00; font-weight: 700;">${team.total}</td>
                    <td>
                        <div class="status-wrapper status-${statusClass}">
                            <div class="status-dot"></div>
                            <span>${team.status}</span>
                        </div>
                    </td>
                `;

                const detailTr = document.createElement('tr');
                detailTr.id = detailId;
                detailTr.className = `details-row ${isOpen ? 'open' : ''}`;
                detailTr.innerHTML = `
                    <td colspan="6">
                        <div class="player-grid">
                            <div class="player-card">
                                <div class="player-title">Player 1</div>
                                <div class="player-stats">${team.p1}</div>
                            </div>
                            <div class="player-card">
                                <div class="player-title">Player 2</div>
                                <div class="player-stats">${team.p2}</div>
                            </div>
                            <div class="player-card">
                                <div class="player-title">Player 3</div>
                                <div class="player-stats">${team.p3}</div>
                            </div>
                        </div>
                    </td>
                `;

                tbody.appendChild(mainTr);
                tbody.appendChild(detailTr);
            });
        }

        function toggleDetails(teamName, detailId, arrowId) {
            const detailRow = document.getElementById(detailId);
            const arrow = document.getElementById(arrowId);
            
            if (openTeams.has(teamName)) {
                openTeams.delete(teamName);
                if (detailRow) detailRow.classList.remove('open');
                if (arrow) arrow.classList.remove('rotated');
            } else {
                openTeams.add(teamName);
                if (detailRow) detailRow.classList.add('open');
                if (arrow) arrow.classList.add('rotated');
            }
        }

        function filterTeams() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            const filtered = globalData.filter(team => team.name.toLowerCase().includes(query));
            renderTable(filtered);
        }

        fetchLeaderboard();
        setInterval(fetchLeaderboard, 3000); 
    </script>
</body>
</html>
